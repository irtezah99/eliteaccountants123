name: Deploy real-estate-site to GitHub Pages

# Pages source is set to "GitHub Actions" in repo settings; this triggers a run.
# Only main can deploy: the github-pages environment is restricted to the
# default branch, so pushes from feature branches were failing instantly
# at the environment gate (no logs, no runner ever assigned).
on:
  push:
    branches:
      - main
    paths:
      - "real-estate-site/**"
      - ".github/workflows/deploy-real-estate-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: real-estate-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
